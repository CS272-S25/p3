<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile - BadgerCS Nexus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/global.css"/>
  <style>
    .profile-card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    .profile-icon {
      font-size: 3rem;
      color: var(--badger-red);
    }
    .profile-header {
      text-align: center;
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/badgercs-logo.svg" alt="BadgerCS Logo" width="30" height="30" class="d-inline-block align-top">
        BadgerCS Career Nexus
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="jobs.html">Jobs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="forum.html">Community</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="interview-prep.html">Interview Prep</a>
          </li>
        </ul>
        <div id="authButtons" class="d-flex">
          <a href="sign-in.html" class="btn btn-outline-light me-2">Login</a>
          <a href="register.html" class="btn btn-danger">Register</a>
        </div>
        <div id="userProfile" class="d-none"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    <a href="#mainContent" class="visually-hidden-focusable">Skip to Content</a>
    <div class="profile-card" id="mainContent">
      <div class="profile-header">
        <div class="profile-icon mb-2">
          <i class="fas fa-user-circle" aria-hidden="true"></i>
        </div>
        <h3 id="userNickname" tabindex="0">User Nickname</h3>
        <p class="text-muted" id="userType" tabindex="0">User Type</p>
      </div>
      <ul class="list-group list-group-flush" role="list">
        <li class="list-group-item" role="listitem">
          <strong>Email:</strong> <span id="userEmail"></span>
        </li>
        <li class="list-group-item" role="listitem">
          <strong>Major:</strong> <span id="userMajor"></span>
        </li>
        <li class="list-group-item" role="listitem">
          <strong>User ID:</strong> <span id="userId"></span>
        </li>
      </ul>
    </div>
  </main>

  <script>
    // Hardcoded user JSON object (should be replaced with actual API call)!!!!!
    const userJson = {
      id: 102,
      email: "student@wisc.edu",
      nickname: "BadgerCoder",
      password: "********",
      major: "Computer Science",
      type: "STUDENT" // or "ORG"
    };

    // Populate profile
    function populateUserProfile(user) {
      if (!user || !user.type || (user.type !== "STUDENT" && user.type !== "ORG")) {
        console.error("Invalid user type. Expected 'STUDENT' or 'ORG'.");
        document.querySelector('.profile-card').innerHTML = `
          <p class="text-danger">Unable to load user profile. Please try again later.</p>
        `;
        return;
      }

      document.getElementById('userId').textContent = user.id || "N/A";
      document.getElementById('userEmail').textContent = user.email || "N/A";
      document.getElementById('userNickname').textContent = user.nickname || "N/A";
      document.getElementById('userMajor').textContent = user.major || "N/A";
      document.getElementById('userType').textContent = user.type === "STUDENT" ? "Student" : "Organization";
    }

    populateUserProfile(userJson);

    // Login detection
    function checkLoginStatus() {
      const userId = localStorage.getItem('userId');
      const authButtonsEl = document.getElementById('authButtons');
      const userProfileEl = document.getElementById('userProfile');

      if (userId) {
        authButtonsEl.classList.add('d-none');
        userProfileEl.classList.remove('d-none');
        userProfileEl.innerHTML = '';

        const profileLink = document.createElement('a');
        profileLink.href = 'dashboard.html';
        profileLink.className = 'btn btn-outline-light me-2';
        profileLink.innerHTML = `<i class="fas fa-user-circle me-1"></i> User_${userId.substring(0, 4)}`;

        const logoutBtn = document.createElement('button');
        logoutBtn.className = 'btn btn-outline-light';
        logoutBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Logout';
        logoutBtn.onclick = () => {
          localStorage.removeItem('userId');
          location.reload();
        };

        userProfileEl.appendChild(profileLink);
        userProfileEl.appendChild(logoutBtn);
      } else {
        authButtonsEl.classList.remove('d-none');
        userProfileEl.classList.add('d-none');
      }
    }

    document.addEventListener('DOMContentLoaded', checkLoginStatus);
  </script>
</body>
</html>
